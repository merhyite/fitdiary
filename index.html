<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121410">
<title>FitDiary</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Шапка -->
<div class="topbar">
  <h1>💪 FitDiary</h1>
  <div id="timerDisplay" onclick="stopTimer()">00:00</div>
</div>

<main class="wrap">
  <!-- ВКЛАДКА 1: ТРЕНИРОВКА -->
  <section class="page on" id="page-workout">
    <div class="card">
      <h2>Выбрать упражнение</h2>
      <input type="text" id="searchInput" placeholder="Поиск..." onclick="openExModal()" readonly>
    </div>

    <div id="activeSession" style="display:none;">
      <div class="card">
        <h2 id="sessionTitle">Тренировка</h2>
        <div id="sessionList"></div>
        <button class="primary" onclick="finishSession()" style="margin-top:15px;">Завершить тренировку</button>
      </div>
    </div>

    <div class="card" id="lastWorkouts">
      <h2>История тренировок</h2>
      <div id="historyList"></div>
    </div>
  </section>

  <!-- ВКЛАДКА 2: ПРОГРЕСС -->
  <section class="page" id="page-progress">
    <div class="card">
      <h2>Вес тела</h2>
      <div class="row">
        <div><label>Дата</label><input type="date" id="wDate"></div>
        <div><label>Вес (кг)</label><input type="number" id="wKg" step="0.1"></div>
      </div>
      <button class="primary" onclick="addWeight()" style="margin-top:10px;">Сохранить</button>
      <div id="weightList" style="margin-top:15px;"></div>
    </div>

    <div class="card">
      <h2>Карта мышц</h2>
      <div id="muscleMap"></div>
    </div>
  </section>

  <!-- ВКЛАДКА 3: ПРОФИЛЬ -->
  <section class="page" id="page-profile">
    <div class="card" style="text-align:center;">
      <div id="profileAvatar" style="width:80px; height:80px; background:var(--line); border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center;"></div>
      <input type="text" id="userName" placeholder="Ваше имя" style="text-align:center; font-size:20px; font-weight:700;" onchange="saveName(this.value)">
    </div>

    <div class="card">
      <h2>🔥 Серия</h2>
      <div style="font-size:36px; font-weight:800; color:var(--acc2); text-align:center;" id="streakDisplay">0 дней</div>
      <p style="text-align:center; color:var(--muted); font-size:14px;">Лучшая серия: <span id="bestStreak">0</span></p>
    </div>

    <div class="card">
      <h2>Настройки</h2>
      <label>Таймер отдыха (сек)</label>
      <select id="timerSetting" onchange="saveTimer(this.value)">
        <option value="60">60</option>
        <option value="90">90</option>
        <option value="120">120</option>
      </select>
      <button class="ghost" onclick="resetData()" style="margin-top:15px; color:var(--del); border-color:var(--del);">Сбросить все данные</button>
    </div>
  </section>
</main>

<!-- Модальное окно выбора упражнения -->
<div class="modal" id="exModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeExModal()">&times;</span>
    <h3>База упражнений</h3>
    <input type="text" id="modalSearch" placeholder="Поиск..." onkeyup="filterEx()" style="margin-bottom:15px;">
    <div id="exListContainer" style="max-height: 50vh; overflow-y: auto;"></div>
  </div>
</div>

<!-- Нижняя панель -->
<nav class="bottom">
  <button data-tab="workout" class="on" onclick="switchTab('workout', this)">
    <svg viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1h2V8a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2H4zm16 0a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-2V8a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2h2z"/><path d="M10 11h4v2h-4z"/></svg>
    Трен.
  </button>
  <button data-tab="progress" onclick="switchTab('progress', this)">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
    Прогресс
  </button>
  <button data-tab="profile" onclick="switchTab('profile', this)">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Профиль
  </button>
</nav>

<script src="app.js"></script>
</body>
                                                                               </html>
