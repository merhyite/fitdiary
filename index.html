<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>FitDiary</title>
<link rel="manifest" href="manifest.json">
<style>
  :root[data-theme="dark"] { --bg:#0f1216; --card:#171c22; --line:#242c35; --text:#e8edf3; --muted:#8b98a5; --acc:#4f9cf9; --acc2:#f59e0b; --ok:#22c55e; --del:#ff6b6b; }
  :root[data-theme="light"] { --bg:#f3f4f6; --card:#ffffff; --line:#d1d5db; --text:#1f2937; --muted:#6b7280; --acc:#3b82f6; --acc2:#d97706; --ok:#10b981; --del:#ef4444; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px;transition:background 0.3s,color 0.3s}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);opacity:0.98;backdrop-filter:blur(8px);padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .topbar h1{font-size:16px;margin:0;flex:1}
  .who{display:flex;gap:6px}
  .who button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;cursor:pointer;min-height:38px}
  .who button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .wrap{max-width:760px;margin:0 auto;padding:12px}
  .page{display:none}.page.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:500}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;min-height:44px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .gap{margin-top:10px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 14px;min-height:44px}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.ghost{background:transparent}
  button.wide{width:100%}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;}
  .del{color:var(--del);cursor:pointer;border:0;background:none;padding:6px 8px;font-size:18px;}
  canvas{width:100%;height:180px;display:block}
  .muted{color:var(--muted);font-size:12px}
  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .bottom button{flex:1;background:transparent;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:11px;min-height:auto}
  .bottom button .ico{font-size:20px;line-height:1}
  .bottom button.on{color:var(--acc)}
  .switch{display:flex;gap:6px;margin-bottom:12px}
  .switch button{flex:1;padding:9px;font-size:13px;min-height:38px}
  .switch button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .day-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:14px;gap:4px;width:100%;margin-bottom:8px}
  .day-btn b{font-size:15px} .day-btn small{font-size:11px;color:var(--muted);font-weight:400}
  .sess-row{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;}
  .sess-row.done{border-color:var(--ok);}
  .sess-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .sess-head b{font-size:15px} .sess-head .muted{font-size:12px;}
  .sess-body{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:6px}
  .sess-body input{padding:9px;min-height:auto;font-size:14px;text-align:center}
  .sess-check{width:40px;height:40px;padding:0;font-size:18px;border-radius:10px;background:var(--card);color:var(--muted);}
  .sess-check.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .timer-btn{width:40px;height:40px;padding:0;font-size:18px;border-radius:10px;background:var(--card);color:var(--acc);}
  .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.on{display:flex}
  .modal-content{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:100%;max-height:80vh;overflow-y:auto;position:relative;width:400px;text-align:center}
  .modal-close{position:absolute;top:10px;right:15px;font-size:24px;cursor:pointer;color:var(--muted)}
  .modal-content h3{color:var(--acc);margin-top:0}
  .timer-display{font-size:48px;font-weight:bold;margin:20px 0;color:var(--acc)}
</style>
</head>
<body data-theme="dark">

<div class="topbar">
  <h1>💪 FitDiary</h1>
  <div class="who" id="whoToggle">
    <button data-person="a" class="on">👤 Я</button>
    <button data-person="b">👥 Партнёр</button>
  </div>
</div>

<main class="wrap">
  <section class="page on" id="pg-weight">
    <div class="card">
      <h2>Добавить вес — <span id="wWho">Я</span></h2>
      <div class="row">
        <div><label>Дата</label><input type="date" id="wDate"></div>
        <div><label>Вес, кг</label><input type="number" id="wKg" step="0.1" placeholder="72.5"></div>
      </div>
      <div class="gap"><button class="primary wide" id="wAdd">Сохранить</button></div>
    </div>
    <div class="card"><h2>Динамика веса</h2><canvas id="wChart"></canvas><div id="wSummary" class="muted gap"></div></div>
    <div class="card"><h2>Записи</h2><table><tbody id="wTable"></tbody></table></div>
  </section>
  <section class="page" id="pg-workout">
    <div class="switch" id="trainMode">
      <button data-mode="plan" class="on">📋 По плану</button>
      <button data-mode="manual">✍️ Вручную</button>
    </div>
    <div id="mode-plan">
      <div id="planEmpty" class="card" style="display:none">
        <h2>Где тренируемся? — <span id="planWho">Я</span></h2>
        <div class="switch" id="envSelect">
          <button data-env="gym" class="on">🏢 Зал</button>
          <button data-env="home">🏠 Дом</button>
          <button data-env="street">🌳 Улица</button>
        </div>
        <label>Выбери программу</label>
        <select id="progTypeSelect" class="gap"></select>
        <div id="planButtons" class="gap"></div>
        <div id="customPlansList" class="gap"></div>
        <button class="wide ghost gap" id="createPlanBtn" style="border-style:dashed">+ Создать свой план</button>
      </div>
      <div id="planActive" style="display:none">
        <div class="card">
          <div class="row">
            <div><div class="muted">Сессия</div><b id="sessDayLabel">—</b></div>
            <div><div class="muted">Программа</div><b id="sessUserLabel">—</b></div>
          </div>
        </div>
        <div id="sessExercises"></div>
        <div class="card">
          <button class="primary wide" id="sessFinish">✓ Завершить тренировку</button>
          <button class="wide ghost gap" id="sessCancel">Отменить</button>
        </div>
      </div>
    </div>
    <div id="mode-manual" style="display:none">
      <div class="card">
        <h2>Добавить подход — <span id="tWho">Я</span></h2>
        <div class="row">
          <div><label>Дата</label><input type="date" id="tDate"></div>
          <div><label>Категория</label><select id="tCat"></select></div>
        </div>
        <div class="gap"><label>Упражнение</label><select id="tEx"></select></div>
        <div class="row3 gap">
          <div><label>Вес, кг</label><input type="number" id="tWeight" step="0.5"></div>
          <div><label>Повторы</label><input type="number" id="tReps"></div>
          <div><label>Подходы</label><input type="number" id="tSets" value="3"></div>
        </div>
        <div class="gap"><button class="primary wide" id="tAdd">Записать</button></div>
      </div>
      <div class="card">
        <h2>Последние — <span id="tWho2">Я</span></h2>
        <table>
          <thead><tr><th>Дата</th><th>Упр.</th><th>Вес</th><th>Повт</th><th>Подх</th><th></th></tr></thead>
          <tbody id="tTable"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="page" id="pg-progress">
    <div class="card">
      <h2>Прогресс — <span id="pWho">Я</span></h2>
      <select id="pEx"></select>
      <div class="gap"><canvas id="pChart"></canvas></div>
      <div id="pStats" class="gap"></div>
    </div>
    <div class="card">
      <h2>Данные</h2>
      <div class="row">
        <button id="expBtn">📤 Экспорт</button>
        <button id="impBtn">📥 Импорт</button>
      </div>
      <input type="file" id="impFile" accept="application/json" style="display:none">
    </div>
  </section>

  <section class="page" id="pg-pair">
    <div class="card">
      <h2>Сравнение веса</h2>
      <canvas id="pairChart"></canvas>
      <div class="muted gap">🔵 Я &nbsp;&nbsp; 🟠 Партнёр</div>
    </div>
  </section>

  <section class="page" id="pg-profile">
    <div class="card">
      <h2>Настройки</h2>
      <div class="row">
        <div><label>Режим</label><select id="setMode"><option value="pair">Парный</option><option value="solo">Одиночный</option></select></div>
        <div><label>Тема</label><select id="setTheme"><option value="dark">Темная</option><option value="light">Светлая</option></select></div>
      </div>
    </div>
    <div class="card">
      <h2>🍏 Калькулятор БЖУ</h2>
      <div class="row3 gap">
        <div><label>Вес (кг)</label><input type="number" id="bjuWeight" placeholder="70"></div>
        <div><label>Рост (см)</label><input type="number" id="bjuHeight" placeholder="175"></div>
        <div><label>Возраст</label><input type="number" id="bjuAge" placeholder="25"></div>
      </div>
      <div class="gap"><button class="primary wide" id="bjuCalc">Рассчитать норму</button></div>
      <div id="bjuResult" class="gap" style="font-size:14px; line-height:1.6;"></div>
    </div>
    <div class="card" id="profileSetupB">
      <h2>Профиль Партнёра</h2>
      <div class="row">
        <div><label>Пол</label><select id="genderB"><option value="male">М</option><option value="female">Ж</option></select></div>
        <div><label>Цель</label><select id="goalB"><option value="mass">Масса</option><option value="cut">Сушка</option></select></div>
      </div>
    </div>
    <div class="card">
      <h2>📚 База знаний</h2>
      <button class="wide ghost gap" id="btnTheory" style="text-align:left">🏋️‍♂️ Бодибилдинг vs Пауэрлифтинг</button>
      <button class="wide ghost gap" id="btnTips" style="text-align:left">💡 Советы по упражнениям</button>
      <button class="wide ghost gap" id="btnHome" style="text-align:left">🏠 Тренировки дома</button>
      <button class="wide ghost gap" id="btnStreet" style="text-align:left">🌳 Турники и брусья</button>
    </div>
  </section>
</main>

<div class="modal" id="infoModal"><div class="modal-content"><span class="modal-close" id="modalClose">&times;</span><div id="modalBody"></div></div></div>
<div class="modal" id="timerModal"><div class="modal-content"><h3>Отдых</h3><div class="timer-display" id="timerDisplay">01:30</div><button class="primary wide" id="timerStop">Стоп</button></div></div>

<nav class="bottom">
  <button data-tab="weight" class="on"><span class="ico">⚖️</span>Вес</button>
  <button data-tab="workout"><span class="ico">🏋️</span>Трен.</button>
  <button data-tab="progress"><span class="ico">📈</span>Прогресс</button>
  <button data-tab="pair" id="navPair"><span class="ico">👥</span>Парная</button>
  <button data-tab="profile"><span class="ico">⚙️</span>Профиль</button>
</nav>

<script>
const EXERCISES = {
  'Грудь (Зал)': ['Жим лёжа', 'Жим на наклонной скамье', 'Жим гантелей лёжа', 'Бабочка (пек-дек)'],
  'Спина (Зал)': ['Тяга блока к поясу', 'Тяга блока сверху', 'Становая тяга', 'Румынская тяга'],
  'Ноги (Зал)': ['Присед в Смите', 'Присед со штангой', 'Жим ногами', 'Разгибание ног', 'Сгибание ног лёжа'],
  'Плечи (Зал)': ['Жим гантелей сидя', 'Жим штанги стоя', 'Махи гантелями в стороны', 'Обратная бабочка'],
  'Руки (Зал)': ['Подъём штанги на бицепс', 'Молотки', 'Жим узким хватом', 'Разгибание на блоке'],
  'Дом (Без инв.)': ['Отжимания от пола', 'Приседания', 'Выпады на месте', 'Обратные отжимания', 'Планка'],
  'Дом (С гантелями)': ['Жим гантелей лёжа', 'Тяга гантели', 'Приседания с гантелями', 'Махи в стороны'],
  'Улица': ['Подтягивания (прямой)', 'Подтягивания (обратный)', 'Отжимания на брусьях', 'Подъём ног в висе'],
  'Пресс': ['Скручивания', 'Планка', 'Велосипед'],
  'Кардио': ['Бег', 'Скакалка']
};
const ALL_EX = Object.values(EXERCISES).flat();

const ENVS = {
  gym: { progs: { base: 'Базовая', bb: 'Бодибилдинг', pl: 'Пауэрлифтинг' } },
  home: { progs: { home1: 'Без инвентаря', home2: 'С гантелями' } },
  street: { progs: { street1: 'Турники и брусья' } }
};

const PROGRAMS = {
  base: { tue: [{ex:'Жим лёжа'}, {ex:'Тяга блока к поясу'}, {ex:'Присед в Смите'}], fri: [{ex:'Становая тяга'}, {ex:'Жим гантелей сидя'}, {ex:'Подъём штанги на бицепс'}] },
  bb: { tue: [{ex:'Жим лёжа'}, {ex:'Бабочка (пек-дек)'}, {ex:'Разгибание на блоке'}], fri: [{ex:'Тяга блока к поясу'}, {ex:'Подъём штанги на бицепс'}], sat: [{ex:'Присед со штангой'}, {ex:'Жим ногами'}] },
  pl: { tue: [{ex:'Присед со штангой'}, {ex:'Жим лёжа'}], fri: [{ex:'Становая тяга'}, {ex:'Жим гантелей сидя'}] },
  home1: { tue: [{ex:'Отжимания от пола'}, {ex:'Приседания'}, {ex:'Планка'}], fri: [{ex:'Обратные отжимания'}, {ex:'Выпады на месте'}, {ex:'Скручивания'}] },
  home2: { tue: [{ex:'Жим гантелей лёжа'}, {ex:'Приседания с гантелями'}], fri: [{ex:'Тяга гантели'}, {ex:'Махи в стороны'}] },
  street1: { tue: [{ex:'Подтягивания (прямой)'}, {ex:'Отжимания на брусьях'}], fri: [{ex:'Подтягивания (обратный)'}, {ex:'Подъём ног в висе'}] }
};

const KNOWLEDGE = {
  theory: `<h3>Бодибилдинг vs Пауэрлифтинг</h3><p><b>Бодибилдинг</b> — эстетика, 8-15 повторов.</p><p><b>Пауэрлифтинг</b> — сила, 1-6 повторов.</p>`,
  tips: `<h3>Советы</h3><p>Своди лопатки в жиме. В приседе колени смотрят в носки. В тяге спина прямая.</p>`,
  home: `<h3>Дом</h3><p>Главное — прогрессия. Усложняй упражнения и делай медленные опускания.</p>`,
  street: `<h3>Улица</h3><p>Начинай со сведения лопаток. Не разводи локти на брусьях.</p>`
};

const LS='fitdiary-v9';
function loadDB(){
  try{ const v9=JSON.parse(localStorage.getItem(LS)); if(v9&&v9.athletes) return v9; }catch(e){}
  return {version:9, env:'gym', mode:'pair', theme:'dark', athletes:{a:'Я', b:'Партнёр'}, gender:{a:'male', b:'female'}, goal:{a:'mass', b:'cut'}, current:'a', session:null, weights:[], workouts:[], customPlans:[], progType:'base'};
}
let db = loadDB();
const save = () => localStorage.setItem(LS, JSON.stringify(db));
const $ = s => document.querySelector(s);
const today = () => new Date().toLocaleDateString('sv-SE');

function applyTheme() { document.body.setAttribute('data-theme', db.theme || 'dark'); $('#setTheme').value = db.theme || 'dark'; }
function openModal(title, html) { $('#modalBody').innerHTML = `<h3>${title}</h3>${html}`; $('#infoModal').classList.add('on'); }

$('#modalClose').onclick = () => $('#infoModal').classList.remove('on');
$('#infoModal').onclick = (e) => { if(e.target.id === 'infoModal') $('#infoModal').classList.remove('on'); };
$('#btnTheory').onclick = () => openModal('Теория', KNOWLEDGE.theory);
$('#btnTips').onclick = () => openModal('Советы', KNOWLEDGE.tips);
$('#btnHome').onclick = () => openModal('Дом', KNOWLEDGE.home);
$('#btnStreet').onclick = () => openModal('Улица', KNOWLEDGE.street);

let timerInt = null;
function startTimer(sec) {
  clearInterval(timerInt);
  let time = sec;
  $('#timerModal').classList.add('on');
  const update = () => {
    const m = Math.floor(time/60), s = time%60;
    $('#timerDisplay').textContent = `${m<10?'0':''}${m}:${s<10?'0':''}${s}`;
    if(time <= 0) {
      clearInterval(timerInt); if(navigator.vibrate) navigator.vibrate([200,100,200]);
      $('#timerDisplay').textContent = "ГОТОВО!"; setTimeout(()=>$('#timerModal').classList.remove('on'), 2000);
    }
    time--;
  };
  update(); timerInt = setInterval(update, 1000);
}
$('#timerStop').onclick = () => { clearInterval(timerInt); $('#timerModal').classList.remove('on'); };

let tab='weight';
document.querySelectorAll('.bottom button').forEach(b=>{
  b.onclick = () => {
    if(b.style.display === 'none') return;
    tab=b.dataset.tab;
    document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on', x===b));
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id==='pg-'+tab));
    renderAll();
  };
});
document.querySelectorAll('.who button').forEach(b=>{ b.onclick = () => { db.current = b.dataset.person; save(); renderAll(); }; });

let trainMode = 'plan';
document.querySelectorAll('#trainMode button').forEach(b=>{
  b.onclick = () => {
    trainMode = b.dataset.mode;
    document.querySelectorAll('#trainMode button').forEach(x=>x.classList.toggle('on', x===b));
    $('#mode-plan').style.display = trainMode==='plan'?'block':'none';
    $('#mode-manual').style.display = trainMode==='manual'?'block':'none';
  };
});

document.querySelectorAll('#envSelect button').forEach(b=>{
  b.onclick = () => { db.env = b.dataset.env; db.progType = Object.keys(ENVS[db.env].progs)[0]; save(); renderPlan(); };
});

$('#setMode').onchange = (e) => { db.mode = e.target.value; save(); renderAll(); };
$('#setTheme').onchange = (e) => { db.theme = e.target.value; save(); applyTheme(); };
$('#genderB').onchange = (e) => { db.gender.b = e.target.value; save(); };
$('#goalB').onchange = (e) => { db.goal.b = e.target.value; save(); };
$('#progTypeSelect').onchange = (e) => { db.progType = e.target.value; save(); renderPlan(); };

$('#bjuCalc').onclick = () => {
  const w = parseFloat($('#bjuWeight').value); const h = parseFloat($('#bjuHeight').value); const a = parseInt($('#bjuAge').value);
  if(!w || !h || !a) return alert('Заполни все поля');
  const isMale = db.current === 'a' ? true : false; 
  let bmr = (10 * w) + (6.25 * h) - (5 * a) + (isMale ? 5 : -161);
  let tdee = Math.round(bmr * 1.375); 
  let protein = Math.round(w * 1.8); let fat = Math.round(w * 0.9); let carbs = Math.round((tdee - (protein*4 + fat*9)) / 4);
  $('#bjuResult').innerHTML = `<b>Калории:</b> ~${tdee} ккал<br><b>Белки:</b> ${protein} г<br><b>Жиры:</b> ${fat} г<br><b>Углеводы:</b> ${carbs} г<br><div class="muted">Для набора +10%, для сушки -20%.</div>`;
};
function drawChart(canvas, series){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth || 320, H = canvas.clientHeight || 180;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const all = series.flatMap(s=>s.data);
  if(!all.length){ ctx.fillStyle='#8b98a5'; ctx.font='12px system-ui'; ctx.fillText('Пока нет данных',12,H/2); return; }
  const xs=[...new Set(all.map(d=>d.x))].sort(); const ys=all.map(d=>d.y);
  let min=Math.min(...ys), max=Math.max(...ys);
  if(min===max){ const d=Math.max(1,Math.abs(min)*0.05); min-=d; max+=d; }
  const pad={l:38,r:10,t:12,b:24};
  const X=x=>pad.l + (xs.length===1?(W-pad.l-pad.r)/2 : (W-pad.l-pad.r)*xs.indexOf(x)/(xs.length-1));
  const Y=y=>H-pad.b - (H-pad.t-pad.b)*((y-min)/(max-min));
  ctx.strokeStyle='#8b98a5'; ctx.fillStyle='#8b98a5'; ctx.font='11px system-ui';
  for(let k=0;k<=3;k++){ const v=min+(max-min)*k/3, y=Y(v); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke(); ctx.fillText(String(Math.round(v*10)/10), 3, y+4); }
  series.forEach(s=>{
    if(!s.data.length) return;
    ctx.strokeStyle=s.color; ctx.fillStyle=s.color; ctx.lineWidth=2;
    ctx.beginPath(); s.data.forEach((d,i)=>{ const x=X(d.x),y=Y(d.y); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    s.data.forEach(d=>{ ctx.beginPath(); ctx.arc(X(d.x),Y(d.y),3.5,0,7); ctx.fill(); });
  });
}

function renderWeight(){
  const p=db.current; $('#wWho').textContent = db.athletes[p];
  const list=db.weights.filter(w=>w.p===p).sort((a,b)=>a.date.localeCompare(b.date));
  drawChart($('#wChart'), [{color:'#4f9cf9', data:list.map(w=>({x:w.date, y:w.kg}))}]);
  if(list.length){ const f=list[0], l=list[list.length-1]; $('#wSummary').innerHTML=`Сейчас: <b>${l.kg} кг</b> (${l.date}) · Δ <b>${(l.kg-f.kg).toFixed(1)} кг</b>`; } else $('#wSummary').textContent='Добавь первый замер.';
  $('#wTable').innerHTML=[...list].reverse().map(w=>`<tr><td>${w.date}</td><td>${w.kg} кг</td><td style="text-align:right"><button class="del" data-wdel="${w.date}|${w.p}">×</button></td></tr>`).join('')||'<tr><td class="muted">Пусто</td></tr>';
}
$('#wAdd').onclick=()=>{
  const date=$('#wDate').value, kg=parseFloat($('#wKg').value);
  if(!date||!(kg>0)) return alert('Укажи дату и вес');
  db.weights=db.weights.filter(w=>!(w.date===date&&w.p===db.current));
  db.weights.push({date, kg, p:db.current}); db.weights.sort((a,b)=>a.date.localeCompare(b.date));
  $('#wKg').value=''; save(); renderAll();
};

function lastFor(user, ex){
  const w = db.workouts.filter(w=>w.p===user && w.ex===ex).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return w ? {w:w.weight||'', r:w.reps||'', s:w.sets||''} : {w:'', r:'', s:''};
}

function startSession(dayId, isCustom = false, customExList = null){
  const date = today(); const sess = {date, day: dayId, isCustom, a:{}, b:{}};
  const users = db.mode === 'solo' ? ['a'] : ['a', 'b'];
  users.forEach(user=>{
    let planItems = [];
    if(customExList){ planItems = customExList.map(ex => ({ex})); }
    else if(isCustom){ const cp = db.customPlans.find(p => p.id === dayId); if(cp) planItems = cp.exercises.map(ex => ({ex})); }
    else { planItems = PROGRAMS[db.progType][dayId] || []; }
    planItems.forEach(item=>{
      const last = lastFor(user, item.ex);
      sess[user][item.ex] = {w:last.w, r:last.r, s:last.s, done:false};
    });
  });
  db.session = sess; save(); trainMode = 'plan';
  document.querySelectorAll('#trainMode button').forEach(x=>x.classList.toggle('on', x.dataset.mode==='plan'));
  $('#mode-plan').style.display='block'; $('#mode-manual').style.display='none'; renderAll();
}

function renderPlan(){
  $('#planWho').textContent = db.athletes[db.current];
  document.querySelectorAll('#envSelect button').forEach(b=>b.classList.toggle('on', b.dataset.env===db.env));
  if(!db.session) {
    $('#planEmpty').style.display='block'; $('#planActive').style.display='none'; 
    const envProgs = ENVS[db.env].progs;
    $('#progTypeSelect').innerHTML = Object.keys(envProgs).map(k => `<option value="${k}"${k===db.progType?' selected':''}>${envProgs[k]}</option>`).join('');
    let progButtons = '';
    const prog = PROGRAMS[db.progType];
    Object.keys(prog).forEach((key, idx) => { progButtons += `<button class="day-btn primary" data-start="${key}"><b>День ${idx+1}</b><small>${prog[key].length} упражнений</small></button>`; });
    $('#planButtons').innerHTML = progButtons;
    const lastWorkoutDate = db.workouts.filter(w=>w.p===db.current).sort((a,b)=>b.date.localeCompare(a.date))[0]?.date;
    if(lastWorkoutDate) {
      $('#customPlansList').innerHTML = `<button class="day-btn ghost gap" id="repeatLastBtn" style="border-color:var(--acc2); color:var(--acc2)"><b>🔄 Повторить тренировку</b><small>от ${lastWorkoutDate}</small></button>`;
      $('#repeatLastBtn').onclick = () => {
        const lastEx = [...new Set(db.workouts.filter(w=>w.p===db.current && w.date===lastWorkoutDate).map(w=>w.ex))];
        startSession(null, false, lastEx);
      };
    } else { $('#customPlansList').innerHTML = ''; }
    return; 
  }

  $('#planEmpty').style.display='none'; $('#planActive').style.display='block';
  const user = db.current; const data = db.session[user] || {};
  $('#sessDayLabel').textContent = (db.session.day === 'Повтор' ? 'Повтор' : 'День 1') + ' · ' + db.session.date;
  $('#sessUserLabel').textContent = db.athletes[user];

  let html = '';
  Object.keys(data).forEach(ex => {
    const d = data[ex];
    html += `<div class="sess-row ${d.done?'done':''}"><div class="sess-head"><b>${ex}</b></div><div class="sess-body">
          <input type="number" placeholder="кг" value="${d.w}" data-sess="w" data-user="${user}" data-ex="${ex}">
          <input type="number" placeholder="повт" value="${d.r}" data-sess="r" data-user="${user}" data-ex="${ex}">
          <input type="number" placeholder="подх" value="${d.s}" data-sess="s" data-user="${user}" data-ex="${ex}">
          <button class="timer-btn" onclick="startTimer(90)">⏱️</button>
          <button class="sess-check ${d.done?'on':''}" data-sess-done="${ex}" data-user="${user}">${d.done?'✓':'○'}</button></div></div>`;
  });
  $('#sessExercises').innerHTML = html;
}

document.addEventListener('input', e => {
  const el = e.target;
  if(!el.dataset || !el.dataset.sess || !db.session) return;
  const field = el.dataset.sess, user = el.dataset.user, ex = el.dataset.ex;
  if(!db.session[user][ex]) db.session[user][ex] = {};
  db.session[user][ex][field] = el.value; save();
});

document.addEventListener('click', e => {
  const ex = e.target.dataset && e.target.dataset.sessDone;
  if(!ex || !db.session) return;
  const user = e.target.dataset.user;
  if(!db.session[user][ex]) db.session[user][ex] = {};
  db.session[user][ex].done = !db.session[user][ex].done; save(); renderPlan();
});

document.addEventListener('click', e => {
  const start = e.target.closest && e.target.closest('[data-start]');
  if(start){ startSession(start.dataset.start, start.dataset.custom === 'true'); return; }
});

$('#sessFinish').onclick=()=>{
  if(!db.session) return; let count = 0;
  ['a','b'].forEach(user=>{
    if(!db.session[user]) return;
    Object.entries(db.session[user]).forEach(([ex, d])=>{
      if(d.done && (parseInt(d.r)>0 || parseFloat(d.w)>0)){
        db.workouts.push({id: Date.now()+Math.random(), date: db.session.date, ex, weight: parseFloat(d.w)||0, reps: parseInt(d.r)||0, sets: parseInt(d.s)||1, p: user}); count++;
      }
    });
  });
  db.session = null; save(); alert(`Записано упражнений: ${count}`); renderAll();
};
$('#sessCancel').onclick=()=>{ db.session = null; save(); renderAll(); };

function fillCatSelect(){ const cats=Object.keys(EXERCISES); $('#tCat').innerHTML=cats.map(c=>`<option>${c}</option>`).join(''); fillExSelect(); $('#tCat').onchange=fillExSelect; }
function fillExSelect(){ const cat=$('#tCat').value, list=EXERCISES[cat]||[]; $('#tEx').innerHTML=list.map(e=>`<option>${e}</option>`).join(''); }

function renderWorkouts(){
  const p=db.current; $('#tWho').textContent=db.athletes[p]; $('#tWho2').textContent=db.athletes[p];
  const rows=db.workouts.filter(w=>w.p===p).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,30);
  $('#tTable').innerHTML=rows.map(r=>`<tr><td>${r.date}</td><td>${r.ex}</td><td>${r.weight?r.weight+' кг':'—'}</td><td>${r.reps}</td><td>${r.sets}</td>
     <td style="text-align:right"><button class="del" data-idel="${r.id}">×</button></td></tr>`).join('')||'<tr><td class="muted">Пусто</td></tr>';
}
$('#tAdd').onclick=()=>{
  const date=$('#tDate').value; const ex = $('#tEx').value;
  const weight=parseFloat($('#tWeight').value)||0; const reps=parseInt($('#tReps').value)||0; const sets=parseInt($('#tSets').value)||1;
  if(!date||!ex||!reps) return alert('Укажи дату, упражнение и повторы');
  db.workouts.push({id:Date.now()+Math.random(), date, ex, weight, reps, sets, p:db.current});
  $('#tWeight').value=''; $('#tReps').value=''; save(); renderAll();
};

function renderProgress(){
  const p=db.current; $('#pWho').textContent=db.athletes[p];
  const names=[...new Set([...ALL_EX, ...db.workouts.filter(w=>w.p===p).map(w=>w.ex)])]; const cur=$('#pEx').value;
  $('#pEx').innerHTML=names.map(n=>`<option${n===cur?' selected':''}>${n}</option>`).join('');
  const ex=$('#pEx').value; const rows=db.workouts.filter(w=>w.ex===ex&&w.p===p).sort((a,b)=>a.date.localeCompare(b.date));
  const byDate={}; let max1RM = 0;
  rows.forEach(r=>{ const d=byDate[r.date]||(byDate[r.date]={max:0}); d.max=Math.max(d.max,r.weight); if(r.reps > 0 && r.weight > 0) { const rm = Math.round(r.weight * (1 + r.reps / 30)); if(rm > max1RM) max1RM = rm; } });
  const dates=Object.keys(byDate).sort();
  drawChart($('#pChart'),[{color:'#4f9cf9', data:dates.map(d=>({x:d,y:byDate[d].max}))}]);
  const best=rows.length?Math.max(...rows.map(r=>r.weight)):0;
  $('#pStats').innerHTML=`<div class="row3 stat"><div><div class="muted">Лучший</div><b>${best} кг</b></div><div><div class="muted">1ПМ</div><b>${max1RM} кг</b></div></div>`;
}
$('#pEx').onchange=renderProgress;

function renderPair(){
  if(db.mode === 'solo') return;
  const a=db.athletes.a, b=db.athletes.b;
  const pts = p => db.weights.filter(w=>w.p===p).sort((a,b)=>a.date.localeCompare(b.date)).map(w=>({x:w.date,y:w.kg}));
  drawChart($('#pairChart'), [{color:'#4f9cf9', data:pts('a')}, {color:'#f59e0b', data:pts('b')}]);
}

function renderProfile(){
  $('#setMode').value = db.mode; $('#profNameB').textContent = db.athletes.b; $('#genderB').value = db.gender.b; $('#goalB').value = db.goal.b;
  $('#profileSetupB').style.display = db.mode === 'solo' ? 'none' : 'block'; $('#whoToggle').style.display = db.mode === 'solo' ? 'none' : 'flex'; $('#navPair').style.display = db.mode === 'solo' ? 'none' : 'flex';
  if(db.mode === 'solo' && tab === 'pair') { tab = 'weight'; document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on', x.dataset.tab === 'weight')); document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id === 'pg-weight')); }
}

$('#expBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fitdiary-'+today()+'.json'; a.click(); URL.revokeObjectURL(a.href); };
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.athletes||!Array.isArray(d.weights)) throw 0; db=d; if(!db.customPlans) db.customPlans=[]; if(!db.mode) db.mode='pair'; if(!db.progType) db.progType='base'; if(!db.env) db.env='gym'; if(!db.theme) db.theme='dark'; save(); applyTheme(); renderAll(); alert('Загружено'); }catch(err){ alert('Неверный файл'); } }; rd.readAsText(f); };

document.addEventListener('click', e=>{ const wd=e.target.dataset&&e.target.dataset.wdel; const id=e.target.dataset&&e.target.dataset.idel;
  if(wd){ const [date,p]=wd.split('|'); db.weights=db.weights.filter(w=>!(w.date===date&&w.p===p)); save(); renderAll(); }
  if(id){ db.workouts=db.workouts.filter(w=>String(w.id)!==String(id)); save(); renderAll(); }
});

function renderAll(){
  applyTheme(); renderProfile(); renderWeight(); renderPlan(); renderWorkouts(); renderProgress(); renderPair();
  document.querySelectorAll('.who button').forEach(b=>b.classList.toggle('on', b.dataset.person===db.current));
}
$('#wDate').value=today(); $('#tDate').value=today(); fillCatSelect();
window.addEventListener('resize', ()=>{ renderWeight(); renderProgress(); renderPair(); });
renderAll();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
