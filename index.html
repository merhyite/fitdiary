<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121410">
<title>FitDiary</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>
    <svg viewBox="0 0 24 24" width="24" height="24" fill="var(--acc)"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>
    FitDiary
  </h1>
  <div id="timerDisplay" onclick="stopTimer()">00:00</div>
</div>

<main class="wrap">
  <!-- ТРЕНИРОВКА -->
  <section class="page on" id="page-workout">
    <div class="card">
      <h2>Моя программа</h2>
      <div id="planList"></div>
    </div>

    <div id="activeSession" style="display:none;">
      <div class="card">
        <h2 id="sessionTitle">Тренировка</h2>
        <div id="sessionList"></div>
        <button class="primary" onclick="finishSession()" style="margin-top:15px;">Завершить</button>
        <button class="ghost" onclick="cancelSession()">Отменить</button>
      </div>
    </div>
  </section>

  <!-- ПРОГРЕСС -->
  <section class="page" id="page-progress">
    <div class="card">
      <h2>Вес тела</h2>
      <div class="row">
        <div><label>Дата</label><input type="date" id="wDate"></div>
        <div><label>Вес (кг)</label><input type="number" id="wKg" step="0.1"></div>
      </div>
      <button class="primary" onclick="addWeight()">Сохранить</button>
      <div id="weightResult" class="gap" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h2>Замеры тела</h2>
      <div class="row">
        <div><label>Талия (см)</label><input type="number" id="mWaist" step="0.1"></div>
        <div><label>Грудь (см)</label><input type="number" id="mChest" step="0.1"></div>
        <div><label>Бицепс (см)</label><input type="number" id="mBiceps" step="0.1"></div>
      </div>
      <button class="primary" onclick="saveMeasure()">Сохранить</button>
      <div id="measureResult" class="gap" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h2>Карта мышц</h2>
      <div id="muscleMap"></div>
    </div>

    <div class="card">
      <h2>История упражнений</h2>
      <select id="historyEx" onchange="renderHistoryEx()"></select>
      <div id="historyResult" class="gap" style="margin-top:10px;"></div>
    </div>
  </section>

  <!-- ПИТАНИЕ -->
  <section class="page" id="page-nutrition">
    <div class="card water-card">
      <h2 style="color:#fff;">Вода</h2>
      <div style="font-size:24px; font-weight:800;" id="waterText">0 / 2000 мл</div>
      <div class="water-progress"><div class="water-fill" id="waterFill"></div></div>
      <div class="water-btns">
        <button onclick="addWater(500)">+ 0.5 л</button>
        <button onclick="addWater(1000)">+ 1 л</button>
        <button onclick="addWater(1500)">+ 1.5 л</button>
        <button onclick="addWater(2000)">+ 2 л</button>
      </div>
    </div>

    <div class="card">
      <h2>Калькулятор БЖУ</h2>
      <div class="row">
        <div><label>Пол</label><select id="bjuGender"><option value="male">Мужской</option><option value="female">Женский</option></select></div>
        <div><label>Вес (кг)</label><input type="number" id="bjuWeight"></div>
        <div><label>Рост (см)</label><input type="number" id="bjuHeight"></div>
        <div><label>Возраст</label><input type="number" id="bjuAge"></div>
      </div>
      <button class="primary" onclick="calcBJU()">Рассчитать</button>
      <div id="bjuResult" class="gap" style="margin-top:10px;"></div>
    </div>
  </section>

  <!-- ПРОФИЛЬ -->
  <section class="page" id="page-profile">
    <div class="card" style="text-align:center;">
      <div class="avatar-bg">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"/><path d="M9 10h6v7h-2v6h-2v-6H9v-7z"/></svg>
      </div>
      <input type="text" id="userName" placeholder="Ваше имя" style="text-align:center; font-size:20px; font-weight:700; background:transparent; border:none; border-bottom:1px solid var(--line);" onchange="saveName(this.value)">
    </div>

    <div class="card">
      <h2>Серия</h2>
      <div class="streak-num" id="streakDisplay">0</div>
      <div style="text-align:center; font-size:12px; color:var(--muted);">дней подряд</div>
    </div>

    <div class="card">
      <h2>Достижения</h2>
      <div class="ach-grid" id="achList"></div>
    </div>

    <div class="card">
      <h2>Настройки</h2>
      <label>Таймер (сек)</label>
      <select id="timerSetting" onchange="saveTimer(this.value)">
        <option value="60">60</option>
        <option value="90">90</option>
        <option value="120">120</option>
      </select>
      <button class="danger" onclick="resetData()" style="margin-top:10px;">Сбросить всё</button>
    </div>
  </section>
</main>

<!-- МОДАЛКА УПРАЖНЕНИЙ -->
<div class="modal" id="exModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeExModal()">&times;</span>
    <h3 style="margin-top:0;">База упражнений</h3>
    <div style="overflow-y:auto; flex:1;" id="exModalBody"></div>
  </div>
</div>

<!-- МОДАЛКА ДОСТИЖЕНИЙ -->
<div class="modal" id="achModal">
  <div class="modal-content">
    <span class="modal-close" onclick="document.getElementById('achModal').classList.remove('on')">&times;</span>
    <div id="achModalBody"></div>
  </div>
</div>

<nav class="bottom">
  <button data-tab="workout" class="on" onclick="switchTab('workout', this)">
    <svg viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1h2V8a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2H4zm16 0a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-2V8a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2h2z"/><path d="M10 11h4v2h-4z"/></svg>
    Трен.
  </button>
  <button data-tab="progress" onclick="switchTab('progress', this)">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
    Прогресс
  </button>
  <button data-tab="nutrition" onclick="switchTab('nutrition', this)">
    <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
    Питание
  </button>
  <button data-tab="profile" onclick="switchTab('profile', this)">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Профиль
  </button>
</nav>

<script src="app.js"></script>
</body>
        </html>
