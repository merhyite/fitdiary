<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>FitDiary</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#0f1216; --card:#1c222a; --line:#2e3845; --text:#f3f4f6; --muted:#9ca3af; --acc:#4f9cf9; --acc2:#f59e0b; --ok:#22c55e; --del:#ef4444; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .topbar h1{font-size:20px;margin:0;font-weight:800;color:var(--acc)}
  #timerDisplay { display:none; font-size:20px; font-weight:800; color:var(--acc2); background:rgba(245,158,11,0.1); padding:4px 12px; border-radius:8px; border:1px solid var(--acc2); cursor:pointer; }
  .wrap{max-width:600px;margin:0 auto;padding:16px}
  .page{display:none}.page.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  h2{font-size:16px;margin:0 0 12px;color:var(--text);font-weight:700}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;margin-bottom:10px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:none;background:var(--line);color:var(--text);padding:14px;font-weight:700;width:100%;margin-bottom:8px;}
  button.primary{background:var(--acc);color:#fff}
  button.ghost{background:transparent;border:1px dashed var(--line)}
  button.danger{background:var(--del);color:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:999;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 4px}
  .bottom button{flex:1;background:transparent;color:var(--muted);padding:8px;font-size:12px;border-radius:8px;margin:0}
  .bottom button.on{color:var(--acc);background:rgba(79,156,249,0.1)}
  .day-card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .day-card h3 { margin: 0 0 8px 0; font-size: 16px; color: var(--acc); }
  .ex-list { max-height: 40vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 5px; margin-bottom: 10px; }
  .ex-item { padding: 10px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .ex-cat { font-size: 12px; font-weight: 800; color: var(--acc); margin: 10px 0 5px 0; text-transform: uppercase; }
  .log-row { display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid var(--line); font-size:14px; }
  .sess-ex { display:flex; justify-content:space-between; align-items:center; background:var(--bg); padding:10px; border-radius:8px; margin-bottom:8px; }
  .sess-ex input { width: 60px; margin: 0 5px; padding: 6px; font-size: 14px; text-align:center; }
</style>
</head>
<body>
<div class="topbar">
  <h1>💪 FitDiary</h1>
  <div id="timerDisplay" onclick="stopTimer()">00:00</div>
</div>

<div class="wrap">
  <!-- ВКЛАДКА ПРОГРАММА -->
  <section class="page on" id="page-plan">
    <div class="card">
      <h2>Моя программа на неделю</h2>
      <div id="weekDaysList"></div>
    </div>
    <div class="card">
      <h2>Добавить упражнение в день</h2>
      <select id="daySelect" style="margin-bottom:10px;">
        <option value="Пн">Понедельник</option>
        <option value="Вт">Вторник</option>
        <option value="Ср">Среда</option>
        <option value="Чт">Четверг</option>
        <option value="Пт">Пятница</option>
        <option value="Сб">Суббота</option>
        <option value="Вс">Воскресенье</option>
      </select>
      <input type="text" id="searchEx" placeholder="Поиск упражнения..." oninput="renderExList()">
      <div class="ex-list" id="exList"></div>
      <div class="row">
        <div><label>Цель: Подходы</label><input type="number" id="targetSets" value="3"></div>
        <div><label>Цель: Повторы</label><input type="number" id="targetReps" value="10"></div>
      </div>
      <button class="primary" onclick="addExToPlan()">Добавить в план</button>
    </div>
  </section>

  <!-- ВКЛАДКА ТРЕНИРОВКА -->
  <section class="page" id="page-workout">
    <div class="card" id="activeWorkoutCard" style="display:none;">
      <h2 id="activeWorkoutTitle">Тренировка</h2>
      <div id="activeWorkoutList"></div>
      <button class="primary" onclick="finishWorkout()" style="margin-top:10px;">Завершить</button>
      <button class="ghost" onclick="cancelWorkout()">Отменить</button>
    </div>
    <div class="card">
      <h2>История</h2>
      <div id="historyList"></div>
    </div>
  </section>

  <!-- ВКЛАДКА ВЕС -->
  <section class="page" id="page-weight">
    <div class="card">
      <h2>Добавить вес</h2>
      <label>Дата</label><input type="date" id="wDate">
      <label>Вес (кг)</label><input type="number" id="wKg" step="0.1">
      <button class="primary" onclick="addWeight()">Сохранить</button>
    </div>
    <div class="card">
      <h2>Последние замеры</h2>
      <div id="weightList"></div>
    </div>
  </section>
</div>

<nav class="bottom">
  <button data-tab="plan" class="on" onclick="switchTab('plan', this)">📋 План</button>
  <button data-tab="workout" onclick="switchTab('workout', this)">🏋️ Тренировка</button>
  <button data-tab="weight" onclick="switchTab('weight', this)">⚖️ Вес</button>
</nav>

<script>
const EXERCISES = {
  'Грудь': ['Жим лёжа', 'Жим на наклонной', 'Жим гантелей лёжа', 'Бабочка', 'Сведение в кроссовере'],
  'Спина': ['Тяга блока к поясу (прямой хват)', 'Тяга блока к поясу (обратный хват)', 'Тяга блока сверху', 'Тяга гантели', 'Становая тяга', 'Подтягивания'],
  'Ноги': ['Присед в Смите', 'Присед со штангой', 'Жим ногами', 'Разгибание ног', 'Сгибание ног лёжа', 'Выпады'],
  'Плечи': ['Жим гантелей сидя', 'Махи в стороны', 'Махи в наклоне', 'Обратная бабочка'],
  'Руки': ['Подъём штанги на бицепс', 'Молотки', 'Жим узким хватом', 'Разгибание на блоке'],
  'Пресс': ['Скручивания', 'Планка', 'Подъём ног']
};

let db = JSON.parse(localStorage.getItem('fitdiary_v31')) || { 
  plan: { 'Пн': [], 'Вт': [], 'Ср': [], 'Чт': [], 'Пт': [], 'Сб': [], 'Вс': [] },
  workouts: [], 
  weights: [],
  activeSession: null
};
const save = () => localStorage.setItem('fitdiary_v31', JSON.stringify(db));
const $ = id => document.getElementById(id);
let selectedEx = '';

// ТАЙМЕР
let timerInt;
function startTimer(sec) {
  clearInterval(timerInt);
  let time = sec;
  $('timerDisplay').style.display = 'block';
  const update = () => {
    const m = Math.floor(time/60), s = time%60;
    $('timerDisplay').textContent = `${m<10?'0':''}${m}:${s<10?'0':''}${s}`;
    if(time <= 0) {
      clearInterval(timerInt);
      $('timerDisplay').textContent = "ГОТОВО!";
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      setTimeout(()=>{ $('timerDisplay').style.display = 'none'; }, 5000);
    }
    time--;
  };
  update(); timerInt = setInterval(update, 1000);
}
function stopTimer() { clearInterval(timerInt); $('timerDisplay').style.display = 'none'; }

// СПИСОК УПРАЖНЕНИЙ
function renderExList() {
  const query = $('searchEx').value.toLowerCase();
  const container = $('exList');
  container.innerHTML = '';
  
  for (let [cat, exs] of Object.entries(EXERCISES)) {
    const filtered = exs.filter(ex => ex.toLowerCase().includes(query));
    if(filtered.length > 0) {
      let html = `<div class="ex-cat">${cat}</div>`;
      filtered.forEach(ex => {
        html += `<div class="ex-item" onclick="selectEx('${ex}')">${ex}</div>`;
      });
      container.innerHTML += html;
    }
  }
}
function selectEx(ex) {
  selectedEx = ex;
  $('searchEx').value = ex;
  $('exList').innerHTML = '';
}

// ПЛАН НА НЕДЕЛЮ
function renderPlan() {
  const container = $('weekDaysList');
  container.innerHTML = '';
  
  const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  days.forEach(day => {
    const exs = db.plan[day] || [];
    let html = `<div class="day-card"><h3>${day}</h3>`;
    if(exs.length === 0) {
      html += `<div style="font-size:12px; color:var(--muted); margin-bottom:8px;">Отдых</div>`;
    } else {
      html += `<div style="font-size:12px; color:var(--muted); margin-bottom:8px;">${exs.length} упражнений</div>`;
      html += `<button class="primary" onclick="startWorkout('${day}')" style="margin-bottom:5px;">Начать тренировку</button>`;
      html += `<button class="ghost" onclick="moveDay('${day}')" style="margin-bottom:5px;">🔄 Перенести на другой день</button>`;
      // Кнопка очистки дня
      html += `<button class="danger" onclick="clearDay('${day}')" style="padding:8px; font-size:12px;">Очистить день</button>`;
    }
    html += `</div>`;
    container.innerHTML += html;
  });
}

function addExToPlan() {
  if(!selectedEx) return alert('Выбери упражнение из списка!');
  const day = $('daySelect').value;
  const sets = parseInt($('targetSets').value) || 3;
  const reps = parseInt($('targetReps').value) || 10;
  
  db.plan[day].push({ ex: selectedEx, targetSets: sets, targetReps: reps });
  save(); renderPlan();
  $('searchEx').value = ''; selectedEx = '';
  alert(`Добавлено в ${day}`);
}

function clearDay(day) {
  if(confirm(`Очистить план на ${day}?`)) {
    db.plan[day] = []; save(); renderPlan();
  }
}

function moveDay(fromDay) {
  const toDay = prompt('На какой день перенести? (Пн, Вт, Ср, Чт, Пт, Сб, Вс)', 'Ср');
  if(!toDay || !db.plan[toDay]) return alert('Неверный день');
  db.plan[toDay] = db.plan[toDay].concat(db.plan[fromDay]);
  db.plan[fromDay] = [];
  save(); renderPlan();
  alert(`Тренировка перенесена на ${toDay}`);
}

// ТРЕНИРОВКА
function startWorkout(day) {
  const exs = db.plan[day];
  if(exs.length === 0) return alert('В этот день нет упражнений');
  
  db.activeSession = { day: day, exercises: exs.map(e => ({ ...e, done: false, weight: '', reps: '' })) };
  save();
  renderActiveWorkout();
}

function renderActiveWorkout() {
  if(!db.activeSession) {
    $('activeWorkoutCard').style.display = 'none';
    return;
  }
  $('activeWorkoutCard').style.display = 'block';
  $('activeWorkoutTitle').textContent = `Тренировка: ${db.activeSession.day}`;
  
  const container = $('activeWorkoutList');
  let html = '';
  db.activeSession.exercises.forEach((ex, i) => {
    html += `<div class="sess-ex">
      <div>
        <div style="font-weight:700; font-size:14px; margin-bottom:5px;">${ex.ex}</div>
        <div style="font-size:12px; color:var(--muted);">Цель: ${ex.targetSets}×${ex.targetReps}</div>
      </div>
      <div style="display:flex; align-items:center;">
        <input type="number" placeholder="кг" value="${ex.weight}" onchange="updateEx(${i}, 'weight', this.value)">
        <input type="number" placeholder="п." value="${ex.reps}" onchange="updateEx(${i}, 'reps', this.value)">
        <input type="checkbox" style="width:20px; height:20px; margin-left:5px;" ${ex.done ? 'checked' : ''} onchange="toggleDone(${i})">
      </div>
    </div>`;
  });
  container.innerHTML = html;
  // Таймер на 90 сек
  startTimer(90); 
}

function updateEx(idx, field, val) {
  db.activeSession.exercises[idx][field] = val;
  save();
}
function toggleDone(idx) {
  db.activeSession.exercises[idx].done = !db.activeSession.exercises[idx].done;
  save();
}

function finishWorkout() {
  if(!db.activeSession) return;
  const date = new Date().toLocaleDateString('sv-SE');
  let count = 0;
  
  db.activeSession.exercises.forEach(ex => {
    if(ex.done) {
      db.workouts.push({ date: date, ex: ex.ex, weight: parseFloat(ex.weight)||0, reps: parseInt(ex.reps)||0, sets: ex.targetSets });
      count++;
    }
  });
  
  db.activeSession = null;
  save();
  renderActiveWorkout();
  renderHistory();
  alert(`Записано упражнений: ${count}`);
}

function cancelWorkout() {
  if(confirm('Отменить тренировку?')) {
    db.activeSession = null; save(); renderActiveWorkout();
  }
}

function renderHistory() {
  $('historyList').innerHTML = db.workouts.slice(0, 20).map(w => 
    `<div class="log-row">
      <span>${w.date}</span>
      <span>${w.ex}</span>
      <span><b>${w.weight} кг × ${w.reps}</b> (${w.sets} подх.)</span>
    </div>`
  ).join('') || '<div style="color:var(--muted); font-size:14px;">Пока пусто</div>';
}

// ВЕС
function addWeight() {
  const d = $('wDate').value;
  const kg = parseFloat($('wKg').value);
  if(!d || !kg) return alert('Укажи дату и вес!');
  
  db.weights = db.weights.filter(w => w.date !== d);
  db.weights.push({ date: d, kg });
  db.weights.sort((a,b) => b.date.localeCompare(a.date));
  save();
  
  $('wKg').value = '';
  renderWeights();
}
function renderWeights() {
  $('weightList').innerHTML = db.weights.slice(0, 10).map(w => 
    `<div class="log-row"><span>${w.date}</span><span><b>${w.kg} кг</b></span></div>`
  ).join('') || '<div style="color:var(--muted); font-size:14px;">Нет записей</div>';
}

// НАВИГАЦИЯ
function switchTab(tab, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  $(`page-${tab}`).classList.add('on');
  document.querySelectorAll('.bottom button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

// СТАРТ
$('wDate').value = new Date().toLocaleDateString('sv-SE');
renderExList(); renderPlan(); renderHistory(); renderWeights();
if(db.activeSession) renderActiveWorkout();

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
                                   </html>
