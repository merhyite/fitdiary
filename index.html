<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121410">
<title>FitDiary</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>
    <svg viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1h2V8a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2H4zm16 0a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-2V8a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2h2z"/><path d="M10 11h4v2h-4z"/></svg>
    FitDiary
  </h1>
  <div id="timerDisplay" onclick="stopTimer()">00:00</div>
</div>

<main class="wrap">
  <!-- ТРЕНИРОВКА -->
  <section class="page on" id="page-workout">
    <div class="card">
      <button class="primary" onclick="openExModal()" style="padding: 20px; font-size: 18px;">+ Добавить упражнение</button>
    </div>

    <div id="activeSession" style="display:none;">
      <div class="card">
        <h2 id="sessionTitle">Тренировка</h2>
        <div id="sessionList"></div>
        <button class="primary" onclick="finishSession()" style="margin-top:15px;">Завершить тренировку</button>
        <button class="ghost" onclick="cancelSession()">Отменить</button>
      </div>
    </div>

    <div class="card">
      <h2>История</h2>
      <div id="historyList"></div>
    </div>
  </section>

  <!-- ПРОГРЕСС -->
  <section class="page" id="page-progress">
    <div class="card">
      <h2>Вес тела</h2>
      <div class="row">
        <div><label>Дата</label><input type="date" id="wDate"></div>
        <div><label>Вес (кг)</label><input type="number" id="wKg" step="0.1"></div>
      </div>
      <button class="primary" onclick="addWeight()">Сохранить</button>
      <div id="weightList" style="margin-top:15px;"></div>
    </div>

    <div class="card">
      <h2>Карта мышц</h2>
      <div id="muscleMap"></div>
    </div>
  </section>

  <!-- ПРОФИЛЬ -->
  <section class="page" id="page-profile">
    <div class="card" style="text-align:center;">
      <div class="avatar-container">
        <div class="avatar-flame" id="flameIcon">
          <svg viewBox="0 0 24 24" width="60" height="60" fill="var(--acc2)"><path d="M12 23c-4.4 0-8-3.6-8-8 0-3 2-5.7 4-7.5.5 2 1.5 3.5 3 4.5.5-4 3.5-7 7-8 0 3.5 2 6 3 7.5 1 1.5 1 3.5 1 3.5 0 4.4-3.6 8-8 8z"/></svg>
        </div>
        <div class="avatar-bg" id="profileAvatar"></div>
      </div>
      <input type="text" id="userName" placeholder="Ваше имя" style="text-align:center; font-size:20px; font-weight:700; background:transparent; border:none; border-bottom:1px solid var(--line);" onchange="saveName(this.value)">
    </div>

    <div class="card">
      <div class="streak-box">
        <div class="streak-num" id="streakDisplay">0</div>
        <div class="streak-label">🔥 дней подряд</div>
        <div style="font-size:12px; color:var(--muted); margin-top:10px;">Лучшая серия: <span id="bestStreak">0</span></div>
      </div>
    </div>

    <div class="card">
      <h2>Настройки</h2>
      <label>Пол (иконка)</label>
      <select id="genderSetting" onchange="saveGender(this.value)">
        <option value="male">Мужской</option>
        <option value="female">Женский</option>
      </select>
      <label>Таймер отдыха (сек)</label>
      <select id="timerSetting" onchange="saveTimer(this.value)">
        <option value="60">60</option>
        <option value="90">90</option>
        <option value="120">120</option>
      </select>
      <button class="danger" onclick="resetData()" style="margin-top:10px;">Сбросить все данные</button>
    </div>
  </section>
</main>

<!-- МОДАЛЬНОЕ ОКНО -->
<div class="modal" id="exModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeExModal()">&times;</span>
    <h3>База упражнений</h3>
    <input type="text" id="modalSearch" placeholder="Поиск..." onkeyup="filterEx()">
    <div id="exListContainer" style="overflow-y: auto; flex: 1;"></div>
  </div>
</div>

<nav class="bottom">
  <button data-tab="workout" class="on" onclick="switchTab('workout', this)">
    <svg viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1h2V8a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2H4zm16 0a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-2V8a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2h2z"/><path d="M10 11h4v2h-4z"/></svg>
    Трен.
  </button>
  <button data-tab="progress" onclick="switchTab('progress', this)">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
    Прогресс
  </button>
  <button data-tab="profile" onclick="switchTab('profile', this)">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Профиль
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
