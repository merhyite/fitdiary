<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>FitDiary</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>FitDiary</h1>
  <div id="timerDisplay" onclick="stopTimer()">00:00</div>
</div>

<main class="wrap">
  <!-- ПЛАН -->
  <section class="page on" id="page-plan">
    <div class="card">
      <h2>Моя программа</h2>
      <div id="planList"></div>
    </div>
  </section>

  <!-- ТРЕНИРОВКА -->
  <section class="page" id="page-workout">
    <div id="activeSession" style="display:none;">
      <div class="card">
        <h2 id="sessionTitle">Тренировка</h2>
        <div id="sessionList"></div>
        <button class="primary" onclick="finishSession()" style="margin-top:15px;">Завершить</button>
        <button class="ghost" onclick="cancelSession()">Отменить</button>
      </div>
    </div>
    <div id="noSession" class="card" style="text-align:center;">
      <p style="color:var(--muted);">Нет активной тренировки. Перейдите во вкладку «План», чтобы начать.</p>
    </div>
  </section>

  <!-- ПРОФИЛЬ -->
  <section class="page" id="page-profile">
    <div class="card profile-header">
      <div class="profile-avatar">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
      </div>
      <input type="text" id="userName" placeholder="Ваше имя" style="text-align:center; font-size:22px; font-weight:800; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--text); margin-bottom:0;" onchange="saveName(this.value)">
    </div>

    <div class="card">
      <h2>Настройки</h2>
      <label>Таймер отдыха (сек)</label>
      <select id="timerSetting" onchange="saveTimer(this.value)">
        <option value="60">60</option>
        <option value="90">90</option>
        <option value="120">120</option>
      </select>
      <button class="danger" onclick="resetData()" style="margin-top:10px;">Сбросить всё</button>
    </div>
  </section>
</main>

<nav class="bottom">
  <button data-tab="plan" class="on" onclick="switchTab('plan', this)">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    План
  </button>
  <button data-tab="workout" onclick="switchTab('workout', this)">
    <svg viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1h2V8a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2H4zm16 0a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-2V8a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2h2z"/><path d="M10 11h4v2h-4z"/></svg>
    Трен.
  </button>
  <button data-tab="profile" onclick="switchTab('profile', this)">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Профиль
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
